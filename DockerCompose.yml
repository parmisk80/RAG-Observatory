services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    restart: unless-stopped

  celery_worker:
    build: .
    deploy:
      mode: replicated
      replicas: 1
    command: celery -A celery_config:celery_app worker --loglevel=info --concurrency=1
    depends_on:
      - redis
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    ports: #[]
      - "6379:6379"
    restart: unless-stopped
  
  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped